port 1194
proto udp
dev tun
disable-dco

ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt ta.key
crl-verify crl.pem
tls-version-min 1.2

topology subnet
server 10.8.0.0 255.255.255.0
client-config-dir ccd
push "route 192.168.10.0 255.255.255.0"

data-ciphers AES-256-GCM

keepalive 10 60
explicit-exit-notify 1
persist-key
persist-tun
status /run/openvpn-server/status-server.log 10
verb 3
